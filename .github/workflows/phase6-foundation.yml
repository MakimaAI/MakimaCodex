name: Phase 6 Foundation Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "src/oef/phase6/**"
      - "src/cli/oef-phase6.ts"
      - "tests/oef-phase6-*.test.ts"
      - "tests/oef-phase3-acceptance-demo.test.ts"
      - "tests/oef-phase2-architecture.test.ts"
      - "src/oef/phase3/acceptance/**"
      - "docs/architecture/phase-6-memory-os-scope.md"
      - "README.md"
      - "scripts/privacy-scan.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/phase6-foundation.yml"
  push:
    branches: [main]
    paths:
      - "src/oef/phase6/**"
      - "src/cli/oef-phase6.ts"
      - "tests/oef-phase6-*.test.ts"
      - "tests/oef-phase3-acceptance-demo.test.ts"
      - "tests/oef-phase2-architecture.test.ts"
      - "src/oef/phase3/acceptance/**"
      - "docs/architecture/phase-6-memory-os-scope.md"
      - "README.md"
      - "scripts/privacy-scan.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/phase6-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase6-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase6-evidence:
    name: Phase 6 focused evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require Docker daemon
        run: docker info

      - name: Pull pinned Phase 3 review image
        run: docker pull mcr.microsoft.com/playwright@sha256:57b65fdc9ceabe0ef613124c7bbe2babcf9362c4d85e382fe3b03604e84b428a

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Privacy scan
        run: bun run privacy:scan

      - name: Phase 6 focused tests
        run: bun test --isolate tests/oef-phase6-*.test.ts

      - name: Phase 1-5 representative regression
        run: >-
          bun test --isolate
          tests/oef-phase1-surface.test.ts
          tests/oef-phase2-architecture.test.ts
          tests/oef-phase3-domain.test.ts
          tests/oef-phase4-domain.test.ts
          tests/oef-phase5-architecture.test.ts

      - name: Phase 3 sandbox acceptance
        run: bun test --isolate tests/oef-phase3-acceptance-demo.test.ts

      - name: Run acceptance demo twice
        shell: bash
        run: |
          mkdir -p .artifacts/phase6
          bun run src/cli/index.ts oef-phase6-demo --root .artifacts/phase6 --json | tee .artifacts/phase6/run-1.json
          cp .artifacts/phase6/phase6-demo-report.json .artifacts/phase6/phase6-demo-report-run-1.json
          bun run src/cli/index.ts oef-phase6-demo --root .artifacts/phase6 --json | tee .artifacts/phase6/run-2.json
          cp .artifacts/phase6/phase6-demo-report.json .artifacts/phase6/phase6-demo-report-run-2.json
          cmp .artifacts/phase6/run-1.json .artifacts/phase6/run-2.json
          cmp .artifacts/phase6/phase6-demo-report-run-1.json .artifacts/phase6/phase6-demo-report-run-2.json
          printf '{"commit_sha":"%s","run_id":"%s","workflow":"phase6-foundation"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .artifacts/phase6/ci-metadata.json

      - name: Build and verify artifact hashes
        shell: bash
        run: |
          cd .artifacts/phase6
          sha256sum phase6-demo-report.json phase6-demo-report-run-1.json phase6-demo-report-run-2.json run-1.json run-2.json ci-metadata.json > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload commit-bound acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase6-evidence-${{ github.sha }}
          path: .artifacts/phase6/
          if-no-files-found: error
          retention-days: 30
