name: Phase 7 Foundation Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "src/oef/phase7/**"
      - "src/oef/operations/**"
      - "src/cli/oef-phase7.ts"
      - "src/cli/index.ts"
      - "src/cli/help.ts"
      - "tests/oef-phase7-*.test.ts"
      - "tests/oef-operations.test.ts"
      - "docs/architecture/phase-7-incident-intelligence-scope.md"
      - "README.md"
      - "package.json"
      - ".github/workflows/phase7-foundation.yml"
  push:
    branches: [main]
    paths:
      - "src/oef/phase7/**"
      - "src/oef/operations/**"
      - "src/cli/oef-phase7.ts"
      - "src/cli/index.ts"
      - "src/cli/help.ts"
      - "tests/oef-phase7-*.test.ts"
      - "tests/oef-operations.test.ts"
      - "docs/architecture/phase-7-incident-intelligence-scope.md"
      - "README.md"
      - "package.json"
      - ".github/workflows/phase7-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase7-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase7-evidence:
    name: Phase 7 focused evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Privacy scan
        run: bun run privacy:scan

      - name: Phase 7 and shared operations focused tests
        run: bun test --isolate tests/oef-phase7-*.test.ts tests/oef-operations.test.ts

      - name: Adjacent Phase 2 and Phase 6 regressions
        run: >-
          bun test --isolate
          tests/oef-phase2-domain.test.ts
          tests/oef-phase2-persistence.test.ts
          tests/oef-phase6-domain.test.ts
          tests/oef-phase6-storage-retrieval.test.ts

      - name: Run acceptance demo twice
        shell: bash
        run: |
          mkdir -p .artifacts/phase7
          bun run src/cli/index.ts incident demo --root .artifacts/phase7 --commit-sha "$GITHUB_SHA" --json | tee .artifacts/phase7/run-1.json
          cp .artifacts/phase7/phase7-demo-report.json .artifacts/phase7/phase7-demo-report-run-1.json
          bun run src/cli/index.ts incident demo --root .artifacts/phase7 --commit-sha "$GITHUB_SHA" --json | tee .artifacts/phase7/run-2.json
          cp .artifacts/phase7/phase7-demo-report.json .artifacts/phase7/phase7-demo-report-run-2.json
          cmp .artifacts/phase7/run-1.json .artifacts/phase7/run-2.json
          cmp .artifacts/phase7/phase7-demo-report-run-1.json .artifacts/phase7/phase7-demo-report-run-2.json
          printf '{"commit_sha":"%s","run_id":"%s","workflow":"phase7-foundation"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .artifacts/phase7/ci-metadata.json

      - name: Verify embedded report commit
        run: >-
          bun -e 'const report=await Bun.file(".artifacts/phase7/phase7-demo-report.json").json();
          if (report.commit_sha !== process.env.GITHUB_SHA) throw new Error("PHASE7_REPORT_COMMIT_MISMATCH");'

      - name: Build and verify artifact hashes
        shell: bash
        run: |
          cd .artifacts/phase7
          sha256sum phase7-demo-report.json phase7-demo-report-run-1.json phase7-demo-report-run-2.json run-1.json run-2.json ci-metadata.json > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload commit-bound acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase7-evidence-${{ github.sha }}
          path: |
            .artifacts/phase7/phase7-demo-report.json
            .artifacts/phase7/phase7-demo-report-run-1.json
            .artifacts/phase7/phase7-demo-report-run-2.json
            .artifacts/phase7/run-1.json
            .artifacts/phase7/run-2.json
            .artifacts/phase7/ci-metadata.json
          if-no-files-found: error
          retention-days: 30
